# Publish to npm on a version tag push.
#
# SECURITY (this is a PUBLIC repo — the token must never leak):
#   * Triggers ONLY on a `v*.*.*` tag push. Tags can only be pushed by someone with
#     write access to THIS repo — a pull request from a fork can NOT push a tag here,
#     and GitHub does NOT expose secrets to workflows triggered by fork PRs. So the
#     NPM_TOKEN is only ever available when the maintainer deliberately pushes a tag.
#   * No `pull_request` trigger ⇒ untrusted PR code never runs with the token.
#   * Least privilege: `contents: read`. `id-token: write` is only for npm PROVENANCE
#     (a signed attestation proving this package was built from this repo+commit on
#     GitHub Actions — a supply-chain integrity guarantee, not a secret exposure).
#   * The secret is injected as an env var ONLY in the publish step and is auto-masked
#     (`***`) in all logs by GitHub. It lives only in GitHub's encrypted secret store,
#     never in the repo or on any server.
#   * `environment: npm-publish` lets you (optionally) add a REQUIRED REVIEWER in the
#     repo's Environments settings, so a tag push pauses for your manual approval
#     before publishing — matching the "publish only on explicit go-ahead" policy.
#
# ONE-TIME SETUP (maintainer):
#   1. npmjs.com → Access Tokens → generate an **Automation** token (bypasses 2FA)
#      OR a **Granular Access** token scoped to publish `@cliwant/mcp-sam-gov` only.
#   2. GitHub repo → Settings → Environments → New environment `npm-publish`
#      (optional: add yourself as a Required reviewer for a manual gate), then add a
#      secret `NPM_TOKEN` there. (A repo-level Actions secret named NPM_TOKEN also works.)
#   3. Release = bump version + docs, `git tag vX.Y.Z && git push origin vX.Y.Z`.

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create the matching GitHub Release on the tag
  id-token: write # npm provenance only

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false # nothing here pushes to git; don't leave the token in .git/config

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install (locked)
        run: npm ci

      - name: Build
        run: npm run build

      # Every place a version ships from must agree with the tag: npm (package.json),
      # the Claude Desktop bundle (manifest.json), the MCP Registry (server.json and
      # its npm package entry), the Claude Code plugin (.claude-plugin/plugin.json)
      # and the server's own reported version (SERVER_VERSION).
      - name: Verify the tag matches every shipped version field
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e '
            const tag = process.argv[1];
            const server = require("./server.json");
            const fields = {
              "package.json": require("./package.json").version,
              "manifest.json": require("./manifest.json").version,
              "server.json": server.version,
              "server.json packages[0]": ((server.packages || [])[0] || {}).version,
              ".claude-plugin/plugin.json": require("./.claude-plugin/plugin.json").version,
            };
            let bad = 0;
            for (const name of Object.keys(fields)) {
              console.log(name + "=" + fields[name] + "  tag=" + tag);
              if (fields[name] !== tag) {
                console.log("::error::tag v" + tag + " does not match " + name + " version " + fields[name] + " — refusing to publish");
                bad = 1;
              }
            }
            process.exit(bad);
          ' "$TAG"
          if ! grep -qF "const SERVER_VERSION = \"$TAG\";" src/server.ts; then
            echo "::error::src/server.ts SERVER_VERSION does not match tag v$TAG — refusing to publish"
            exit 1
          fi

      # The bundle job runs only after npm publish, so an invalid manifest must stop
      # the release here, before anything irreversible. Uses the lockfile-installed mcpb.
      - name: Validate the Claude Desktop bundle manifest
        run: npx --no-install mcpb validate manifest.json

      - name: Smoke gate (registry snapshot + fault suite)
        run: |
          node registry-snapshot-test.mjs
          node fault-injection-test.mjs > /tmp/fault.log 2>&1 || { tail -5 /tmp/fault.log; exit 1; }
          tail -1 /tmp/fault.log

      # npm refuses to publish the same version twice. Skipping an already-published
      # version makes this job re-runnable: if a later step (the GitHub Release) fails,
      # "Re-run failed jobs" finishes the release and unblocks the bundle job.
      # `npm view pkg@ver version` exits 0 only when that exact version exists.
      - name: Publish to npm (with provenance)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if npm view "@cliwant/mcp-sam-gov@$VER" version >/dev/null 2>&1; then
            echo "@cliwant/mcp-sam-gov@$VER is already on npm; skipping publish (re-run)."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Keep the GitHub Release in lockstep with the npm version. Notes come from
      # this version's CHANGELOG section; idempotent (edit if the release exists).
      - name: Create the matching GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # Literal (not regex) header match — robust to the [x.y.z] brackets.
          notes="$(awk -v hdr="## [$VER]" '
            index($0, hdr) == 1 {f=1; next}
            f && index($0, "## [") == 1 {exit}
            f {print}
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            notes="Release $GITHUB_REF_NAME. See CHANGELOG.md."
          fi
          notes="$notes

          ---
          📦 npm: \`npm i @cliwant/mcp-sam-gov@$VER\` · published with npm provenance (SLSA v1)."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "$notes"
          fi

  # The Claude Desktop one-click bundle: README install path 1 ("download
  # mcp-sam-gov.mcpb from the latest release") and the artifact submitted to the
  # Anthropic MCP Directory. A separate job so a bundle-only failure can be fixed
  # with "Re-run failed jobs" without repeating the publish job.
  bundle:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the release asset; no npm secret, no id-token
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false # the upload uses GH_TOKEN; no git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # Locked install (dev dependencies included, so mcpb comes from the lockfile,
      # never an unpinned npx download) and the same build the publish job ran.
      # --ignore-scripts: nothing here needs install scripts, so none run.
      - name: Install (locked) and build
        run: |
          npm ci --ignore-scripts
          npm run build

      # Pack from a staging copy: the tagged tree (git archive, so only tracked
      # files), this build's dist/, and production-only dependencies installed from
      # the same lockfile. .mcpbignore (tracked) keeps source, tests and docs out;
      # mcpb's defaults drop .d.ts, source maps, lockfiles and .env files.
      - name: Validate and pack the MCPB bundle
        run: |
          npx --no-install mcpb validate manifest.json
          STAGE="$RUNNER_TEMP/mcpb-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          git archive HEAD | tar -x -C "$STAGE"
          rm -rf "$STAGE/dist" && cp -R dist "$STAGE/dist"
          (cd "$STAGE" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
          npx --no-install mcpb pack "$STAGE" mcp-sam-gov.mcpb

      - name: Attach the bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" mcp-sam-gov.mcpb --clobber --repo "$GITHUB_REPOSITORY"

      # v1.6.0 through v1.12.0 shipped with no bundle on the release and nothing
      # failed, which silently broke README install path 1
      # (releases/latest/download/mcp-sam-gov.mcpb). Check both what the API reports
      # (an uploaded asset with this exact name, over 1 MB) and what a user actually
      # downloads (the public URL resolves). Retries cover brief propagation delay.
      # Values come from env; the jq filter reads the name with env.ASSET_NAME, so
      # nothing is spliced into the filter or the command line.
      - name: Verify the bundle is on the release and downloadable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_NAME: mcp-sam-gov.mcpb
          MIN_BYTES: "1048576"
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$ASSET_NAME"
          size=0
          resolves=no
          for attempt in 1 2 3 4 5; do
            size="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[] | select(.name == env.ASSET_NAME and .state == "uploaded") | .size] | max // 0')" || size=0
            case "$size" in ''|*[!0-9]*) size=0 ;; esac
            resolves=no
            if curl -sfIL --max-time 60 -o /dev/null "$url"; then resolves=yes; fi
            echo "attempt $attempt: $ASSET_NAME size=$size bytes (min $MIN_BYTES), download URL resolves=$resolves"
            if [ "$size" -gt "$MIN_BYTES" ] && [ "$resolves" = yes ]; then
              echo "OK: $ASSET_NAME is attached to $GITHUB_REF_NAME and downloadable."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 10; fi
          done
          if [ "$size" -le "$MIN_BYTES" ]; then
            echo "::error::release $GITHUB_REF_NAME has no uploaded asset named exactly $ASSET_NAME larger than $MIN_BYTES bytes (size=$size) — Claude Desktop install path is broken"
          fi
          if [ "$resolves" != yes ]; then
            echo "::error::$url does not resolve — Claude Desktop install path is broken"
          fi
          exit 1
